name: CBA Clean CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  report-service-test:
    name: Report Service - Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/report-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests (Maven Wrapper)
        run: ./mvnw -B test
