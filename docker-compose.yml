services:
  postgres:
    image: postgres:17-alpine
    container_name: cbaclean-postgres
    environment:
      POSTGRES_DB: cbaclean
      POSTGRES_USER: cbaclean
      POSTGRES_PASSWORD: cbaclean
    ports:
      - "5432:5432"
    volumes:
      - cbaclean_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cbaclean -d cbaclean"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cbaclean-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-cbaclean}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-cbaclean}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - cbaclean_rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  report-service:
    build:
      context: ./backend/report-service
    container_name: cbaclean-report-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/cbaclean
      DB_USERNAME: cbaclean
      DB_PASSWORD: cbaclean
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-cbaclean}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cbaclean}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    container_name: cbaclean-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-cbaclean}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-cbaclean}
    ports:
      - "27017:27017"
    volumes:
      - cbaclean_mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --eval 'db.adminCommand(\"ping\").ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  incident-service:
    build:
      context: ./backend/incident-service
    container_name: cbaclean-incident-service
    environment:
      MONGO_URI: mongodb://${MONGO_USERNAME:-cbaclean}:${MONGO_PASSWORD:-cbaclean}@mongo:27017/cbaclean?authSource=admin
      MONGO_DATABASE: cbaclean
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-cbaclean}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-cbaclean}
      INCIDENT_RETRY_MAX_RETRIES: ${INCIDENT_RETRY_MAX_RETRIES:-3}
      INCIDENT_RETRY_DELAYS: ${INCIDENT_RETRY_DELAYS:-2s,4s,8s}
    ports:
      - "8081:8081"
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  cbaclean_pgdata:
  cbaclean_mongodata:
  cbaclean_rabbitmqdata:
