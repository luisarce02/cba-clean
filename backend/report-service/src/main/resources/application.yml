spring:
  application:
    name: report-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cbaclean}
    username: ${DB_USERNAME:cbaclean}
    password: ${DB_PASSWORD:cbaclean}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:cbaclean}
    password: ${RABBITMQ_PASSWORD:cbaclean}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}
    # Publisher confirms let the outbox publisher treat an event as published
    # only after RabbitMQ accepted it (never merely after convertAndSend
    # returned).
    publisher-confirm-type: correlated

  security:
    oauth2:
      resourceserver:
        jwt:
          # OAuth2 issuer performing OIDC discovery (lazy - the service starts
          # even while the issuer is temporarily unreachable). Alternatively
          # point jwk-set-uri directly at a JWKS endpoint.
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000}
          jwk-set-uri: ${JWT_JWK_SET_URI:}

cbaclean:
  security:
    jwt:
      # Optional audience validation; blank disables the aud check.
      audience: ${JWT_AUDIENCE:}
  cors:
    # Comma-separated list of allowed origins for CORS.
    # Empty in production; set to http://localhost:4200 for Angular dev.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  outbox:
    poll-interval: ${OUTBOX_POLL_INTERVAL:PT5S}
    batch-size: ${OUTBOX_BATCH_SIZE:20}
    publish-confirm-timeout: ${OUTBOX_PUBLISH_CONFIRM_TIMEOUT:PT5S}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  port: 8080

management:
  defaults:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        # Intentionally small surface; sensitive endpoints stay disabled.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
