spring:
  application:
    name: report-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cbaclean}
    username: ${DB_USERNAME:cbaclean}
    password: ${DB_PASSWORD:cbaclean}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:cbaclean}
    password: ${RABBITMQ_PASSWORD:cbaclean}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

server:
  port: 8080

management:
  defaults:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        # Intentionally small surface; sensitive endpoints stay disabled.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
