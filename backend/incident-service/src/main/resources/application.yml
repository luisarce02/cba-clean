spring:
  application:
    name: incident-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/cbaclean}
      database: ${MONGO_DATABASE:cbaclean}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:cbaclean}
    password: ${RABBITMQ_PASSWORD:cbaclean}

server:
  port: 8081

incident:
  messaging:
    retry:
      # Retries after the initial delivery; afterwards messages go to the DLQ.
      max-retries: ${INCIDENT_RETRY_MAX_RETRIES:3}
      # TTL applied by retry queue i = delays[i-1] (progressive backoff).
      delays: ${INCIDENT_RETRY_DELAYS:2s,4s,8s}

management:
  endpoints:
    web:
      exposure:
        include: health
