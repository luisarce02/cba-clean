spring:
  application:
    name: incident-service
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/cbaclean}
      database: ${MONGO_DATABASE:cbaclean}

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:cbaclean}
    password: ${RABBITMQ_PASSWORD:cbaclean}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    ssl:
      enabled: ${RABBITMQ_SSL_ENABLED:false}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Secures the Actuator surface (the service has no REST API; the
          # RabbitMQ flow is authenticated by the broker connection).
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000}
          jwk-set-uri: ${JWT_JWK_SET_URI:}

server:
  port: 8081

incident:
  messaging:
    retry:
      # Retries after the initial delivery; afterwards messages go to the DLQ.
      max-retries: ${INCIDENT_RETRY_MAX_RETRIES:3}
      # TTL applied by retry queue i = delays[i-1] (progressive backoff).
      delays: ${INCIDENT_RETRY_DELAYS:2s,4s,8s}

cbaclean:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  security:
    jwt:
      # Optional audience validation; blank disables the aud check.
      audience: ${JWT_AUDIENCE:}

management:
  endpoints:
    web:
      exposure:
        # Intentionally small surface; sensitive endpoints stay disabled.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
