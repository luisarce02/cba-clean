<div class="map-wrapper" [class.map-readonly]="!interactive">
  <div #mapContainer class="map-container"></div>
  @if (!interactive) {
    <span class="map-readonly-badge">{{ 'locationMap.readonlyBadge' | translate }}</span>
  }
  <div class="map-controls">
    <button type="button" class="map-btn" [disabled]="!interactive" (click)="useMyLocation()">{{ 'locationMap.useMyLocation' | translate }}</button>
    @if (latitude !== null && longitude !== null) {
      <span class="map-coords">{{ latitude | number:'1.4-6' }}, {{ longitude | number:'1.4-6' }}</span>
    }
  </div>
</div>
