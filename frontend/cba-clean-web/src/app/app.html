<header class="app-header">
  <nav>
    <a routerLink="/" class="app-title">CBA Clean</a>
    <div class="auth-controls">
      @if (isAuthenticated()) {
        <span class="user-info">{{ username() }}</span>
        <button type="button" class="btn btn-logout" (click)="onLogout()">Logout</button>
      } @else {
        <button type="button" class="btn btn-login" (click)="onLogin()">Login</button>
      }
    </div>
  </nav>
</header>
@if (isDemoVisitor()) {
  <div class="demo-banner" role="status">
    <strong>Demo Mode — Read Only.</strong>
    You are viewing a public demo of CBA Clean. Authentication is required to interact with the application or modify data.
  </div>
}
<app-navigation />
<main>
  <router-outlet />
</main>
