server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS - allows proxy upstreams to be resolved at request time
    resolver 127.0.0.11 valid=10s;

    # --- Reverse proxy for backend APIs (same-origin support) ---
    location ~ ^/api/v1/incidents {
        set $upstream http://incident-service:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location ~ ^/api/v1/reports {
        set $upstream http://report-service:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location /api/ {
        set $upstream http://report-service:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    # Actuator endpoints for metrics - routed by metric name prefix
    location ~ ^/actuator/metrics/cbaclean\.reports {
        set $upstream http://report-service:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location ~ ^/actuator/metrics/cbaclean\.report {
        set $upstream http://report-service:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location ~ ^/actuator/metrics/cbaclean\.outbox {
        set $upstream http://report-service:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location ~ ^/actuator/metrics/cbaclean\.incidents {
        set $upstream http://incident-service:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location ~ ^/actuator/metrics/cbaclean\.incident {
        set $upstream http://incident-service:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location ~ ^/incident-actuator/(.*) {
        rewrite ^/incident-actuator/(.*) /$1 break;
        set $upstream http://incident-service:8081;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    location /actuator/ {
        set $upstream http://report-service:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;
    }

    # Keycloak OIDC - support same-origin proxy as well as direct
    location /realms/ {
        set $upstream http://keycloak:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prevent stray OIDC discovery at root from falling through to SPA (was returning index.html)
    location ~ ^/\.well-known {
        return 404;
    }

    # SPA fallback - must be last, only for Angular routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache index.html
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }
}
