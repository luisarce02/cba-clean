server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip is handled by nginx defaults; keep config minimal and portfolio-ready

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively, but never cache index.html (SPA entry point)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Optional: health check endpoint - nginx will return 200 for /health via static file check
    # The container is considered healthy if nginx serves traffic on port 80
}
